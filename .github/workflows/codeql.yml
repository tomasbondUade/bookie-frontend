name: CodeQL

on:
  push:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: java-kotlin
          queries: security-extended
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Build for analysis
        run: >-
          ./gradlew --no-daemon --no-build-cache --rerun-tasks --stacktrace
          :androidApp:assembleDebug
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          output: ${{ runner.temp }}/codeql-results
      - name: Fail on high or critical security findings
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail

          if [[ -z "$SARIF_DIR" || ! -d "$SARIF_DIR" ]]; then
            echo "::error::CodeQL SARIF output directory is missing."
            exit 1
          fi

          mapfile -d '' sarif_files < <(find "$SARIF_DIR" -type f -name '*.sarif' -print0)
          if (( ${#sarif_files[@]} == 0 )); then
            echo "::error::CodeQL did not produce a SARIF report."
            exit 1
          fi

          findings=0
          for file in "${sarif_files[@]}"; do
            file_findings="$(jq '[.runs[]? as $run
              | $run.results[]? as $result
              | ($run.tool.driver.rules[]?
                  | select(.id == $result.ruleId)
                  | .properties["security-severity"] // empty)
              | select((tonumber? // 0) >= 7.0)] | length' "$file")"
            findings=$((findings + file_findings))
          done

          if (( findings > 0 )); then
            echo "::error::$findings high or critical CodeQL security finding(s) detected (security-severity >= 7.0)."
            exit 1
          fi

          echo "No high or critical CodeQL security findings detected."
