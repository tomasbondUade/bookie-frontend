name: iOS compilation

on:
  push:
    paths:
      - "shared/**"
      - "gradle/**"
      - "iosApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "shared/**"
      - "gradle/**"
      - "iosApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-ios:
    name: Compile and link iOS Kotlin framework
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install Android SDK for Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            sdkmanager="$(command -v sdkmanager)"
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install "platforms;android-37"
      - name: Compile device target and link simulator framework
        run: >-
          ./gradlew --no-daemon --stacktrace
          :shared:compileKotlinIosArm64
          :shared:linkDebugFrameworkIosSimulatorArm64
