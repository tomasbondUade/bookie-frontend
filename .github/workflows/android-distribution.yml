name: Android distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BOOKIE_API_BASE_URL: ${{ vars.BOOKIE_API_BASE_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Android configuration and signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in BOOKIE_API_BASE_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the $name repository variable before distributing the app."
              exit 1
            fi
          done
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::error::Configure the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret. See docs/android-distribution.md."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey >/dev/null

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build, test, and lint
        run: >-
          ./gradlew --no-daemon --stacktrace
          -PbookieVersionCode="$((GITHUB_RUN_NUMBER + 1))"
          :shared:compileCommonMainKotlinMetadata
          :shared:testAndroidHostTest
          :androidApp:lintDebug
          :androidApp:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bookie-android-${{ github.run_number }}
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Explain Firebase setup is pending
        if: ${{ vars.GCP_PROJECT_ID == '' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '' || vars.FIREBASE_APP_ID == '' || vars.FIREBASE_TESTER_GROUPS == '' }}
        run: echo "::warning::APK built and uploaded. Configure Firebase Actions variables as described in docs/android-distribution.md to email testers automatically."

  distribute:
    name: Distribute APK to Firebase testers
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' && vars.FIREBASE_APP_ID != '' && vars.FIREBASE_TESTER_GROUPS != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bookie-android-${{ github.run_number }}
          path: apk

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.37.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Publish to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: >-
          firebase appdistribution:distribute
          apk/androidApp-debug.apk
          --app "$FIREBASE_APP_ID"
          --groups "$FIREBASE_TESTER_GROUPS"
          --release-notes "Bookie Android build $GITHUB_RUN_NUMBER ($GITHUB_SHA)"
